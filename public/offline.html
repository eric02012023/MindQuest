<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No connection | MindQuest Tutorial Center</title>
  <meta name="theme-color" content="#064c02" />
  <!-- Everything is inline on purpose: this page is shown when the network is
       gone, so it cannot depend on a stylesheet or font being reachable. -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #102033;
      background: linear-gradient(180deg, #f7fff7 0%, #eefff0 100%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: #fff;
      border: 1px solid rgba(6, 76, 2, .12);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 18px 40px rgba(6, 76, 2, .10);
    }
    img { width: 84px; height: 84px; margin: 0 0 18px; }
    h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
    p { margin: 0 0 22px; font-size: 15px; line-height: 1.6; color: #5f7084; }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(180deg, #19791b 0%, #064c02 100%);
      border-radius: 999px;
      padding: 12px 30px;
    }
    button:hover { filter: brightness(1.06); }
    .hint { margin: 20px 0 0; font-size: 13px; color: #7c8a9a; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/icon-192.png" alt="MindQuest Tutorial Center" />
    <h1>You are offline</h1>
    <p>MindQuest needs an internet connection to load your lessons, assessments and messages. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">The app will reconnect on its own once you are back online.</p>
  </main>
  <script>
    // Reload the moment the device reports it is back on the network, so the
    // person does not have to notice and press the button themselves.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
